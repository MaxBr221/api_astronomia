server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: api-astronomia

  datasource:
    url: jdbc:postgresql://localhost:5432/astronomia_db
    username: postgres
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
